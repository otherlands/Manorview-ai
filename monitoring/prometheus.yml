global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:9000']

  # vLLM exposes Prometheus metrics at /metrics
  - job_name: 'vllm-deep'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.4.20:8000']

  - job_name: 'vllm-fast'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.4.21:8001']
